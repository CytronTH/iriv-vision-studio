name: Build IRIV Model Studio

on:
  push:
    branches:
      - model-studio
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies (Electron + electron-builder)
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build Electron Windows installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRIV-Model-Studio-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
