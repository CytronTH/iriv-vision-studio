name: Build & Release IRIV Model Studio

on:
  push:
    branches:
      - model-studio
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Windows Installer & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump patch version (1.0.{run_number})
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "Building version: $VERSION"
          # Update version in package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('Version set to:', pkg.version);
          "

      - name: Install root dependencies (Electron + electron-builder)
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build & Publish Electron installer to GitHub Releases
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: IRIV-Model-Studio-v1.0.${{ github.run_number }}
          path: dist/*.exe
          if-no-files-found: warn
          retention-days: 7
